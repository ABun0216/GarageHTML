<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - City Centre Vehicle Garage</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="mainstyle.css">
  <style>
    .contact-form-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }
    .contact-form-wrapper .form-side,
    .contact-form-wrapper .map-side {
      flex: 1 1 45%;
      min-width: 300px;
    }
    .contact-form-wrapper iframe {
      width: 100%;
      height: 260px;
      border: 0;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <!-- Header -->
    <header class="header_section">
  <!-- Top row -->
  <div class="header_top clean-topbar">
    <div class="container-fluid header_top_row">
      <div class="left_info">
        <i class="fa fa-phone"></i> Call: +44 1234 567890
      </div>
      <div class="logo_centered">
    	CC_Garage
      </div>
      <div class="right_info">
        <i class="fa fa-envelope"></i> info@ccgarage.com
      </div>
    </div>
  </div>
  <div class="header_bottom clean-bottombar">
    <div class="container-fluid">
      <nav class="navbar navbar-expand custom_nav-container">
        <ul class="navbar-nav nav_centered">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="service.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
    <!-- End Header -->

    <!-- Contact Section -->
    <section class="layout_padding">
      <div class="container">
        <div class="heading_container">
          <h2>Contact Us</h2>
          <p style="color: #fff">If you have any questions or want to book a service, feel free to reach out.</p>
        </div>
    </section>
    </div><br><br>
    <div>
        <form action="#" method="POST">
          <div class="contact-form-wrapper">
            <div class="form-side">
              <input type="text" class="form-control" placeholder="Your Name" required>
              <input type="email" class="form-control" placeholder="Your Email" required>
              <input type="text" class="form-control" placeholder="Phone Number">
              <textarea class="form-control" rows="5" placeholder="Your Message" required></textarea>
              <button type="submit" class="btn btn-primary">Send Message</button>
            </div>

            <div class="map-side">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093746!2d144.9537363153167!3d-37.8162797797517!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43f1f3c2f7%3A0x5045675218ce6e0!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sau!4v1614036085273!5m2!1sen!2sau" allowfullscreen="" loading="lazy"></iframe>
            </div>
          </div>
        </form>
      </div>
  </div>
<div>

  <!-- Footer -->
  <footer class="footer_section">
    <div class="container">
      <p>
        &copy; <span id="displayDateYear"></span> All Rights Reserved By City Centre Vehicle Garage
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/custom.js"></script>
</body>

</html>
